<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentIsland - 日报卡 (Daily Report Card) 总览与各Agent分Tab展示</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /*
     * AgentIsland 日报卡 (Daily Report Card) - 总览 + 各 Agent 专属 Tab 架构
     * 1. 结构：
     *    - 顶部：全局日报总计 (全天消耗 Tokens / 估算美金、KPI 指标带、24H 脉冲柱)
     *    - 中部：Segmented Capsule Tab Bar [ 🌐 总览 ] [ ⚡ DeepSeek ] [ 🔷 Antigravity ] [ 🤖 Codex ]
     *    - 下部：
     *      * [总览 Tab]：多宿主全局占比彩色分段条 + 发丝树状分支 (Hairline Tree Branching)，宏观一览全局
     *      * [Agent Tab]：进入该 Agent 的专属卡片，完整展现旗下全部模型 (无截断、无折叠、带排名/占比进度条/轮次/Token数)
     * 2. 规范：严格锁定 420px × 560px portrait (ReportCards.CardWidth / CardHeight)
     * 3. 视觉：极简高密度 Dark 风格，微型圆角胶囊、等宽 Tabular 数字、发丝边框与精细色彩层次
     */
    :root {
      --card-w: 420px;
      --card-h: 560px;
      --base-bg: #0D0F13;
      --border-hairline: #2D323E;

      /* Color tokens */
      --live-teal: #3DD68C;
      --period-accent: #2DD4BF; /* Teal accent for DAILY & peak hour */
      --price-green: #34D399;   /* Emerald green for dollar amounts */
      --text-hero: #F2F5F7;
      --text-white-90: rgba(255, 255, 255, 0.90);
      --text-white-80: rgba(255, 255, 255, 0.80);
      --text-white-65: rgba(255, 255, 255, 0.65);
      --text-white-50: rgba(255, 255, 255, 0.50);
      --text-white-40: rgba(255, 255, 255, 0.40);
      --text-white-25: rgba(255, 255, 255, 0.25);
      --gold-rank: #F59E0B;

      /* Provider brand accents */
      --claude-accent: #CC785C;
      --codex-accent: #A78BFA;
      --deepseek-accent: #4D6BFE;
      --antigravity-accent: #4285F4;
      --grok-accent: #D8DEE4;
      --cursor-accent: #F5F3EE;
      --doubao-accent: #29C264;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: #060709;
      color: #FFF;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      user-select: none;
    }

    /* Floating Capsule Pager Bar */
    .pager-bar {
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #13161C;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 17px;
      height: 34px;
      padding: 0 4px;
      box-shadow: 0 3px 16px rgba(0, 0, 0, 0.4);
    }

    .pager-btn {
      width: 26px;
      height: 26px;
      border-radius: 13px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.15s ease;
    }

    .pager-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #FFF;
    }

    .pager-label {
      font-size: 12px;
      font-weight: 700;
      color: #F2F2F2;
      min-width: 150px;
      text-align: center;
      font-feature-settings: "tnum" 1;
      cursor: pointer;
    }

    /* Fixed 420x560 Share Card (ReportCards.Card) */
    .report-card {
      width: var(--card-w);
      height: var(--card-h);
      background: var(--base-bg);
      border: 1px solid var(--border-hairline);
      border-radius: 24px;
      padding: 20px 22px 18px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
    }

    .card-content {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 1. Header */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 22px;
    }

    .brand-left {
      display: flex;
      align-items: center;
    }

    .brand-logo {
      width: 20px;
      height: 20px;
      margin-right: 8px;
      object-fit: contain;
    }

    .brand-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--text-white-90);
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--period-accent);
      margin-left: 6px;
    }

    .header-range {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-white-65);
      font-feature-settings: "tnum" 1;
    }

    /* 2. Hero Total Area */
    .card-hero {
      display: flex;
      flex-direction: column;
      margin-top: 1px;
    }

    .hero-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1px;
    }

    .hero-title {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-white-50);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .hero-delta-pill {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--live-teal);
      font-feature-settings: "tnum" 1;
    }

    .hero-baseline {
      display: flex;
      align-items: baseline;
      white-space: nowrap;
      overflow: hidden;
    }

    .hero-number {
      font-size: 38px;
      font-weight: 800;
      line-height: 40px;
      color: var(--text-hero);
      font-feature-settings: "tnum" 1;
      letter-spacing: -0.03em;
    }

    .hero-unit {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-hero);
      margin-left: 3px;
    }

    .hero-dollars {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--price-green);
      margin-left: 10px;
      margin-bottom: 2px;
      font-feature-settings: "tnum" 1;
    }

    /* 3. Daily KPI Strip (3-Column compact stats) */
    .kpi-strip {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 5px 8px;
      margin: 1px 0;
    }

    .kpi-cell {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .kpi-cell:not(:last-child) {
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      padding-right: 6px;
    }

    .kpi-label {
      font-size: 8.5px;
      font-weight: 600;
      color: var(--text-white-40);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .kpi-val {
      font-size: 12px;
      font-weight: 800;
      color: #FFF;
      font-feature-settings: "tnum" 1;
    }

    .kpi-sub {
      font-size: 8px;
      font-weight: 600;
      color: var(--period-accent);
    }

    /* 4. 24-Hour Activity Pulse (24根紧凑脉冲柱) */
    .hourly-pulse-area {
      display: flex;
      flex-direction: column;
      margin: 1px 0;
    }

    .pulse-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .pulse-caption {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-white-40);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .pulse-peak-badge {
      font-size: 8.5px;
      font-weight: 800;
      color: var(--period-accent);
      font-feature-settings: "tnum" 1;
    }

    .hours-grid {
      display: grid;
      grid-template-columns: repeat(24, 1fr);
      align-items: flex-end;
      gap: 2px;
      height: 28px;
    }

    .hour-bar-col {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .hour-bar {
      width: 100%;
      min-height: 2px;
      border-radius: 1px;
      background: rgba(255, 255, 255, 0.07);
    }

    .hour-bar.has-tokens {
      background: rgba(255, 255, 255, 0.2);
    }

    .hour-bar.peak {
      background: var(--period-accent);
      box-shadow: 0 0 6px rgba(45, 212, 191, 0.5);
    }

    .hours-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
      font-size: 7.5px;
      font-weight: 700;
      color: var(--text-white-35);
      font-feature-settings: "tnum" 1;
    }

    /* 5. Segmented Capsule Tab Bar (核心新增：总览 + 各 Agents 专属 Tab) */
    .report-tab-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 2.5px;
      margin: 3px 0 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .report-tab-bar::-webkit-scrollbar {
      display: none;
    }

    .tab-pill {
      flex: 1;
      min-width: 0;
      height: 25px;
      border-radius: 11px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-white-50);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0 6px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.16s ease;
    }

    .tab-pill:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-white-80);
    }

    .tab-pill.active {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.18);
      color: #FFF;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .tab-pill.active.is-deepseek {
      background: rgba(77, 107, 254, 0.18);
      border-color: rgba(77, 107, 254, 0.45);
      color: #FFF;
    }

    .tab-pill.active.is-antigravity {
      background: rgba(66, 133, 244, 0.18);
      border-color: rgba(66, 133, 244, 0.45);
      color: #FFF;
    }

    .tab-pill.active.is-codex {
      background: rgba(167, 139, 250, 0.18);
      border-color: rgba(167, 139, 250, 0.45);
      color: #FFF;
    }

    .tab-pill.active.is-claude {
      background: rgba(204, 120, 92, 0.18);
      border-color: rgba(204, 120, 92, 0.45);
      color: #FFF;
    }

    .tab-icon {
      font-size: 10px;
      line-height: 1;
    }

    .tab-logo-img {
      width: 12px;
      height: 12px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .tab-badge {
      font-size: 8px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-white-70);
      border-radius: 6px;
      padding: 0 4px;
      line-height: 12px;
      font-feature-settings: "tnum" 1;
    }

    .tab-pill.active .tab-badge {
      background: rgba(255, 255, 255, 0.22);
      color: #FFF;
    }

    /* 6. Dynamic Content Section (Tab Viewport: 固定高度容纳，绝不上浮溢出) */
    .tab-panel-container {
      height: 206px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      margin-top: 2px;
    }

    /* ─── TAB VIEW 1: [总览 OVERVIEW] ─── */
    .overview-view {
      display: flex;
      flex-direction: column;
      gap: 5px;
      height: 100%;
      animation: fadeIn 0.18s ease-in-out;
    }

    .overview-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }

    .overview-title {
      font-size: 9.5px;
      font-weight: 800;
      color: var(--text-white-50);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .overview-legend {
      font-size: 8.5px;
      font-weight: 600;
      color: var(--text-white-40);
    }

    /* 全局多 Agent 彩色分段条 (Stacked Proportion Bar) */
    .global-stacked-bar {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      display: flex;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .stacked-bar-segment {
      height: 100%;
      transition: width 0.3s ease;
    }

    /* 树形块 */
    .overview-tree-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 1px;
    }

    .agent-tree-block {
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 7px;
      padding: 3px 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .agent-tree-block:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.09);
    }

    .agent-parent-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 18px;
    }

    .agent-parent-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .agent-title {
      font-size: 11px;
      font-weight: 800;
      color: #FFF;
      letter-spacing: -0.01em;
    }

    .agent-share-bar-wrap {
      width: 44px;
      height: 4px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 2px;
      overflow: hidden;
      margin-left: 4px;
    }

    .agent-share-bar-fill {
      height: 100%;
      border-radius: 2px;
    }

    .agent-quick-jump {
      font-size: 8px;
      font-weight: 700;
      color: var(--period-accent);
      opacity: 0;
      transform: translateX(-3px);
      transition: all 0.15s ease;
      margin-left: 4px;
    }

    .agent-tree-block:hover .agent-quick-jump {
      opacity: 1;
      transform: translateX(0);
    }

    .agent-parent-right {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .agent-total-tokens {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-white-90);
      font-feature-settings: "tnum" 1;
    }

    .agent-total-dollars {
      font-size: 9.5px;
      font-weight: 800;
      color: #8CD99E;
      font-feature-settings: "tnum" 1;
      min-width: 32px;
      text-align: right;
    }

    .agent-total-dollars.unpriced {
      color: var(--text-white-25);
    }

    .agent-total-pct {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--text-white-90);
      font-feature-settings: "tnum" 1;
      width: 26px;
      text-align: right;
    }

    .model-children-container {
      display: flex;
      flex-direction: column;
      padding-left: 6px;
    }

    .model-child-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 15px;
    }

    .model-tree-line {
      display: inline-flex;
      align-items: center;
      color: rgba(255, 255, 255, 0.22);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      margin-right: 5px;
      user-select: none;
    }

    .model-name-text {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--text-white-65);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .model-metrics-group {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .model-sub-turns {
      font-size: 8px;
      font-weight: 600;
      color: var(--text-white-35);
      font-feature-settings: "tnum" 1;
    }

    .model-sub-tokens {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-white-50);
      font-feature-settings: "tnum" 1;
      min-width: 40px;
      text-align: right;
    }

    .model-sub-share {
      font-size: 8.5px;
      font-weight: 700;
      color: var(--text-white-40);
      font-feature-settings: "tnum" 1;
      width: 26px;
      text-align: right;
    }

    .model-more-link {
      color: var(--period-accent);
      font-size: 8.5px;
      font-weight: 700;
      text-decoration: none;
    }

    /* ─── TAB VIEW 2: [AGENT 专属 TAB (如 DeepSeek)] ─── */
    .agent-detail-view {
      display: flex;
      flex-direction: column;
      gap: 4px;
      height: 100%;
      animation: fadeIn 0.18s ease-in-out;
    }

    .agent-detail-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 5px 8px;
    }

    .banner-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .banner-title {
      font-size: 12px;
      font-weight: 800;
      color: #FFF;
    }

    .banner-models-count {
      font-size: 8.5px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-white-80);
      border-radius: 4px;
      padding: 1px 5px;
    }

    .banner-right {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .banner-total-tokens {
      font-size: 13px;
      font-weight: 800;
      color: #FFF;
      font-feature-settings: "tnum" 1;
    }

    .banner-share-tag {
      font-size: 9px;
      font-weight: 800;
      color: var(--period-accent);
      background: rgba(45, 212, 191, 0.12);
      border-radius: 4px;
      padding: 1px 4px;
    }

    /* Agent 专用微型指标 */
    .agent-micro-kpi {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 8.5px;
      color: var(--text-white-40);
      padding: 0 4px;
    }

    .micro-kpi-item {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .micro-kpi-val {
      font-weight: 700;
      color: var(--text-white-80);
      font-feature-settings: "tnum" 1;
    }

    /* 全模型详细列表 (全显示，无折叠) */
    .agent-models-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
      scrollbar-width: none;
      flex: 1;
    }

    .agent-models-list::-webkit-scrollbar {
      display: none;
    }

    .detail-model-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.045);
      border-radius: 7px;
      padding: 5px 8px;
      transition: all 0.12s ease;
    }

    .detail-model-card:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .model-card-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .rank-pill {
      font-size: 8.5px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-white-40);
      width: 16px;
      height: 16px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .rank-pill.rank-1 {
      background: rgba(245, 158, 11, 0.18);
      color: #F59E0B;
    }

    .rank-pill.rank-2 {
      background: rgba(200, 205, 215, 0.15);
      color: #DDE2EC;
    }

    .rank-pill.rank-3 {
      background: rgba(205, 127, 50, 0.15);
      color: #D79A6D;
    }

    .model-info-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }

    .model-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .model-detail-name {
      font-size: 10px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: #FFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }

    /* 宿主内占比细进度条 */
    .model-intra-bar-wrap {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 1.5px;
      overflow: hidden;
      margin-top: 1px;
    }

      border-radius: 1.5px;

      align-items: baseline;
      gap: 8px;
      flex-shrink: 0;
      margin-left: 8px;
    }

      font-weight: 600;
      color: var(--text-white-40);
      font-feature-settings: "tnum" 1;
    }

    .model-card-tokens {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--text-white-90);
      font-feature-settings: "tnum" 1;
      min-width: 48px;
      text-align: right;
    }

    .model-card-pct {
      font-size: 9.5px;
      font-weight: 800;
      color: var(--period-accent);
      font-feature-settings: "tnum" 1;
      width: 32px;
      text-align: right;
    }

    .agent-detail-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 2px;
    }

    .back-to-overview-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-white-65);
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 8.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .back-to-overview-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #FFF;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .nav-other-agents {
      font-size: 8.5px;
      color: var(--text-white-35);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 7. Footer (Gold Rank Line) */
    .card-footer {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      height: 18px;
    }

    .footer-rank {
      font-size: 10px;
      font-weight: 700;
      color: var(--gold-rank);
    }

    .footer-lifetime {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-white-35);
      letter-spacing: 0.05em;
    }

    /* Bottom Action Buttons */
    .window-actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }

    .action-btn {
      height: 30px;
      border-radius: 15px;
      padding: 0 18px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s ease;
    }

    .action-btn-primary {
      background: #252830;
      color: #FFF;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .action-btn-primary:hover {
      background: #323642;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      background: #181B22;
      color: #FFF;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    let currentIndex = 0;
    let currentTab = 'overview'; // 'overview' | 'deepseek' | 'antigravity' | 'codex' | ...
    let isZh = true;

    function render() {
      const data = hierarchicalDailyRecords[currentIndex];

      // 1. Pager & Header
      document.getElementById('pager-title').textContent = isZh ? data.pagerLabel : data.pagerLabelEn;
      document.getElementById('header-date').textContent = isZh ? data.dateStr : data.dateStrEn;

      // 2. Hero Area
      document.getElementById('hero-title').textContent = isZh ? "全天消耗" : "TOTAL USAGE";
      document.getElementById('hero-delta').textContent = isZh ? data.deltaText : data.deltaTextEn;

      const { val, unit } = compactTokens(data.totalTokens, isZh);
      document.getElementById('hero-num').textContent = val;
      document.getElementById('hero-unit').textContent = unit;

      if (data.hasDollars) {
        document.getElementById('hero-dollars').textContent = `≈ $${data.totalDollars.toFixed(2)} (估算)`;
        document.getElementById('hero-dollars').style.display = 'inline';
      } else {
        document.getElementById('hero-dollars').style.display = 'none';
      }

      // 3. KPI Strip
      document.getElementById('kpi-lbl-turns').textContent = isZh ? "轮次 TURNS" : "TURNS";
      document.getElementById('kpi-val-turns').textContent = `${data.turns}`;
      document.getElementById('kpi-sub-turns').textContent = isZh ? `${data.sessions} 个会话` : `${data.sessions} sessions`;

      document.getElementById('kpi-lbl-cache').textContent = isZh ? "PROMPT 缓存" : "PROMPT CACHE";
      document.getElementById('kpi-val-cache').textContent = data.cacheRate;
      document.getElementById('kpi-sub-cache').textContent = isZh ? `省 ${data.cacheSavings}` : `Saved ${data.cacheSavings}`;

      document.getElementById('kpi-lbl-agents').textContent = isZh ? "宿主 / 模型" : "HOSTS / MODELS";
      document.getElementById('kpi-val-agents').textContent = isZh ? `${data.activeAgentsCount} 家活跃` : `${data.activeAgentsCount} Active`;
      document.getElementById('kpi-sub-agents').textContent = isZh ? `${data.totalModelsCount} 款模型` : `${data.totalModelsCount} Models`;

      // 4. 24-Hour Activity Pulse
      document.getElementById('pulse-title').textContent = isZh ? "24H 脉冲" : "24H PULSE";
      document.getElementById('pulse-peak-label').textContent = isZh ? data.peakText : data.peakTextEn;

      const maxTokens = Math.max(...data.hourlyTokens, 1);
      const hoursGrid = document.getElementById('hours-grid');
      hoursGrid.innerHTML = '';

      data.hourlyTokens.forEach((tok, h) => {
        const col = document.createElement('div');
        col.className = 'hour-bar-col';

        const bar = document.createElement('div');
        const isPeak = tok === maxTokens && tok > 0;
        bar.className = 'hour-bar' + (tok > 0 ? ' has-tokens' : '') + (isPeak ? ' peak' : '');
        const heightPx = Math.max(2, (tok / maxTokens) * 26);
        bar.style.height = heightPx + 'px';
        bar.title = `${h}:00 - ${h+1}:00: ${tok.toLocaleString()} Tokens`;

        hoursGrid.appendChild(col);
      });

      // 5. Render Capsule Tabs (动态生成当前日期的 Agent 按钮)
      renderTabBar(data.agents);

      // 6. Render Active Tab Viewport
      renderTabContent(data);

      // 7. Footer
      document.getElementById('footer-rank').textContent = isZh ? data.rankText : data.rankTextEn;
    }

    // 渲染胶囊 Tab 切换栏
    function renderTabBar(agents) {
      const tabBar = document.getElementById('reportTabBar');
      tabBar.innerHTML = '';

      // Tab 0: 总览 (Overview)
      const overviewPill = document.createElement('button');
      overviewPill.className = 'tab-pill' + (currentTab === 'overview' ? ' active' : '');
      overviewPill.innerHTML = `
        <svg class="tab-logo-img" viewBox="0 0 12 12" fill="none" style="vertical-align: middle;">
          <ellipse cx="6" cy="6" rx="5" ry="5" fill="rgba(45, 212, 191, 0.16)" stroke="#2DD4BF" stroke-width="1.2" />
          <ellipse cx="6" cy="6" rx="2.4" ry="5" stroke="#2DD4BF" stroke-width="1.0" />
          <line x1="1" y1="6" x2="11" y2="6" stroke="#2DD4BF" stroke-width="1.0" />
        </svg>
        <span>${isZh ? '总览' : 'Overview'}</span>
      `;
      overviewPill.onclick = () => switchTab('overview');
      tabBar.appendChild(overviewPill);

      // 各个 Agent 专属 Tab
      agents.forEach(agent => {
        const pill = document.createElement('button');
        const isActive = currentTab === agent.id;
        pill.className = `tab-pill is-${agent.id}` + (isActive ? ' active' : '');
        pill.innerHTML = `
          ${getAgentMarkHtml(agent.id, 13)}
          <span>${agent.name}</span>
          <span class="tab-badge">${agent.models.length}</span>
        `;
        pill.onclick = () => switchTab(agent.id);
        tabBar.appendChild(pill);
      });
    }

    function switchTab(tabId) {
      currentTab = tabId;
      const data = hierarchicalDailyRecords[currentIndex];
      renderTabBar(data.agents);
      renderTabContent(data);
    }

    // 渲染对应 Tab 面板内容
    function renderTabContent(data) {
      const container = document.getElementById('tabPanelContainer');
      container.innerHTML = '';

      if (currentTab === 'overview') {
        renderOverviewView(container, data);
      } else {
        const selectedAgent = data.agents.find(a => a.id === currentTab);
        if (selectedAgent) {
          renderAgentDetailView(container, selectedAgent, data);
        } else {
          // Fallback to overview if agent not found
          currentTab = 'overview';
          renderOverviewView(container, data);
        }
      }
    }

    // ─── 视图 1：总览 (宏观彩色分段条 + 树状分支) ───
    function renderOverviewView(container, data) {
      const view = document.createElement('div');
      view.className = 'overview-view';

      // 标题与说明
      const header = document.createElement('div');
      header.className = 'overview-header-row';
      header.innerHTML = `
        <span class="overview-title">AGENTS 全局分布与模型树</span>
        <span class="overview-legend">点击 Agent 可展开专属 Tab</span>
      `;
      view.appendChild(header);

      // 多 Agent 宏观彩色分段条 (Stacked Proportion Bar)
      const bar = document.createElement('div');
      bar.className = 'global-stacked-bar';
      data.agents.forEach(agent => {
        const seg = document.createElement('div');
        seg.className = 'stacked-bar-segment';
        const pct = Math.max(2, Math.round(agent.percent * 100));
        seg.style.width = `${pct}%`;
        seg.style.backgroundColor = agent.accent;
        seg.title = `${agent.name}: ${compactShort(agent.tokens, isZh)} (${Math.round(agent.percent * 100)}%)`;
        bar.appendChild(seg);
      });
      view.appendChild(bar);

      // 树形列表容器
      const treeContainer = document.createElement('div');
      treeContainer.className = 'overview-tree-container';

      data.agents.forEach(agent => {
        const block = document.createElement('div');
        block.className = 'agent-tree-block';
        block.onclick = () => switchTab(agent.id);

        const dollarsStr = agent.hasPrice ? `$${agent.dollars.toFixed(2)}` : '—';
        const dollarClass = agent.hasPrice ? 'agent-total-dollars' : 'agent-total-dollars unpriced';

        // Level 1: Agent Header Row
        const parentRow = document.createElement('div');
        parentRow.className = 'agent-parent-row';
        parentRow.innerHTML = `
          <div class="agent-parent-left">
            ${getAgentMarkHtml(agent.id, 14)}
            <span class="agent-title">${agent.name}</span>
            <div class="agent-share-bar-wrap" title="${Math.round(agent.percent * 100)}%">
              <div class="agent-share-bar-fill" style="width: ${Math.round(agent.percent * 100)}%; background: ${agent.accent};"></div>
            </div>
            <span class="agent-quick-jump">专属Tab ➔</span>
          </div>
          <div class="agent-parent-right">
            <span class="agent-total-tokens">${compactShort(agent.tokens, isZh)}</span>
            <span class="${dollarClass}">${dollarsStr}</span>
            <span class="agent-total-pct">${Math.round(agent.percent * 100)}%</span>
          </div>
        `;
        block.appendChild(parentRow);

        // Level 2: Child Models (若模型数超过2个，总览显示前2个并提示专属Tab)
        const childrenContainer = document.createElement('div');
        childrenContainer.className = 'model-children-container';

        const maxDisplayInOverview = 2;
        const displayModels = agent.models.slice(0, maxDisplayInOverview);
        const hasMore = agent.models.length > maxDisplayInOverview;

        displayModels.forEach((mod, idx) => {
          const isLast = !hasMore && (idx === displayModels.length - 1);
          const wireChar = isLast ? '└──' : '├──';

          const childRow = document.createElement('div');
          childRow.className = 'model-child-row';
          childRow.innerHTML = `
            <div style="display: flex; align-items: center; overflow: hidden;">
              <span class="model-tree-line">${wireChar}</span>
              <span class="model-name-text">${mod.name}</span>
            </div>
            <div class="model-metrics-group">
              <span class="model-sub-turns">${mod.turns}轮</span>
              <span class="model-sub-tokens">${compactShort(mod.tokens, isZh)}</span>
              <span class="model-sub-share">${Math.round((mod.globalPercent || mod.percent) * 100)}%</span>
            </div>
          `;
          childrenContainer.appendChild(childRow);
        });

        if (hasMore) {
          const moreCount = agent.models.length - maxDisplayInOverview;
          const moreNames = agent.models.slice(maxDisplayInOverview).map(m => m.name).join(' / ');
          const moreRow = document.createElement('div');
          moreRow.className = 'model-child-row';
          moreRow.innerHTML = `
            <div style="display: flex; align-items: center; overflow: hidden;">
              <span class="model-tree-line">└──</span>
              <span class="model-more-link">+${moreCount}款模型 (${moreNames}) · 进入专属Tab ➔</span>
            </div>
          `;
          childrenContainer.appendChild(moreRow);
        }

        block.appendChild(childrenContainer);
        treeContainer.appendChild(block);
      });

      view.appendChild(treeContainer);
      container.appendChild(view);
    }

    // ─── 视图 2：各个 Agent 专属 Tab (如 DeepSeek 专属明细) ───
    function renderAgentDetailView(container, agent, dayData) {
      const view = document.createElement('div');
      view.className = 'agent-detail-view';

      // 1. Agent 专属横幅
      const banner = document.createElement('div');
      banner.className = 'agent-detail-banner';
      banner.innerHTML = `
        <div class="banner-left">
          ${getAgentMarkHtml(agent.id, 18)}
          <span class="banner-title">${agent.name} 消耗全貌</span>
          <span class="banner-models-count">${agent.models.length} 款模型</span>
        </div>
        <div class="banner-right">
          <span class="banner-total-tokens">${compactShort(agent.tokens, isZh)}</span>
          <span class="banner-share-tag">全天 ${Math.round(agent.percent * 100)}%</span>
        </div>
      `;
      view.appendChild(banner);

      // 2. 微型指标带 (轮次、缓存率、主力模型)
      const topModel = agent.models[0];
      const microKpi = document.createElement('div');
      microKpi.className = 'agent-micro-kpi';
      microKpi.innerHTML = `
        <div class="micro-kpi-item">
          <span>总轮次:</span>
          <span class="micro-kpi-val">${agent.turns || 0} 轮</span>
        </div>
        <div class="micro-kpi-item">
          <span>缓存命中:</span>
          <span class="micro-kpi-val">${agent.cacheRate || '75%'}</span>
        </div>
        <div class="micro-kpi-item">
          <span>主力:</span>
          <span class="micro-kpi-val">${topModel ? topModel.name : '-'}</span>
        </div>
      `;
      view.appendChild(microKpi);

      // 3. 全模型完整列表 (无截断展示每个模型)
      const list = document.createElement('div');
      list.className = 'agent-models-list';

      agent.models.forEach((mod, idx) => {
        const card = document.createElement('div');
        card.className = 'detail-model-card';

        const rankClass = idx === 0 ? 'rank-1' : (idx === 1 ? 'rank-2' : (idx === 2 ? 'rank-3' : ''));
        const intraPct = Math.round(mod.percent * 100);

        card.innerHTML = `
          <div class="model-card-left">
            <span class="rank-pill ${rankClass}">#${idx + 1}</span>
            <div class="model-info-block">
              <div class="model-name-row">
                <span class="model-detail-name" title="${mod.name}">${mod.name}</span>
              </div>
              <div class="model-intra-bar-wrap">
                <div class="model-intra-bar-fill" style="width: ${intraPct}%; background: ${agent.accent};"></div>
              </div>
            </div>
          </div>
          <div class="model-card-right">
            <span class="model-card-turns">${mod.turns}轮</span>
            <span class="model-card-tokens">${compactShort(mod.tokens, isZh)}</span>
            <span class="model-card-pct">${intraPct}%</span>
          </div>
        `;
        list.appendChild(card);
      });

      view.appendChild(list);

      container.appendChild(view);
    }

    function compactTokens(n, zh) {
      if (zh) {
        if (n >= 100000000) return { val: (n / 100000000).toFixed(1).replace('.0', ''), unit: "亿" };
        if (n >= 10000) return { val: Math.round(n / 10000).toString(), unit: "万" };
        return { val: n.toLocaleString(), unit: "" };
      }
      if (n >= 1000000) return { val: (n / 1000000).toFixed(2).replace(/\.?0+$/, ''), unit: "M" };
      if (n >= 1000) return { val: Math.round(n / 1000).toString(), unit: "K" };
      return { val: n.toString(), unit: "" };
    }

    function compactShort(n, zh) {
      if (zh) {
        if (n >= 100000000) return (n / 100000000).toFixed(1).replace('.0', '') + "亿";
        if (n >= 10000) return Math.round(n / 10000) + "万";
        return n.toString();
      }
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + "M";
      if (n >= 1000) return Math.round(n / 1000) + "K";
      return n.toString();
    }

    function stepPeriod(delta) {
      const next = currentIndex - delta;
      if (next >= 0 && next < hierarchicalDailyRecords.length) {
        currentIndex = next;
        // 如果切换日期后当前 tab 不在新的 agents 里，重置回 overview
        const data = hierarchicalDailyRecords[currentIndex];
        if (currentTab !== 'overview' && !data.agents.some(a => a.id === currentTab)) {
          currentTab = 'overview';
        }
        render();
      }
    }

    function resetToToday() {
      currentIndex = 0;
      currentTab = 'overview';
      render();
    }

    // 复制图片与保存图片 (3x Retina 导出画布)
    function renderToCanvas() {
      const canvas = document.getElementById('renderCanvas');
      const ctx = canvas.getContext('2d');
      const scale = 3;
      canvas.width = 420 * scale;
      canvas.height = 560 * scale;
      ctx.scale(scale, scale);

      // Card Background #0D0F13
      ctx.fillStyle = "#0D0F13";
      roundRect(ctx, 0, 0, 420, 560, 24);
      ctx.fill();

      // Border #2D323E
      ctx.strokeStyle = "#2D323E";
      ctx.lineWidth = 1;
      roundRect(ctx, 0.5, 0.5, 419, 559, 24);
      ctx.stroke();

      const data = hierarchicalDailyRecords[currentIndex];

      // Header
      ctx.fillStyle = "rgba(255,255,255,0.88)";
      ctx.font = "800 11px Segoe UI";
      ctx.fillText("AGENT ISLAND", 56, 38);

      ctx.fillStyle = "#2DD4BF";
      ctx.fillText("DAILY", 154, 38);

      ctx.fillStyle = "rgba(255,255,255,0.65)";
      ctx.font = "700 11px Segoe UI";
      ctx.textAlign = "right";
      ctx.fillText(isZh ? data.dateStr : data.dateStrEn, 396, 38);
      ctx.textAlign = "left";

      // Hero
      ctx.fillStyle = "rgba(255,255,255,0.50)";
      ctx.font = "700 10.5px Segoe UI";
      ctx.fillText(isZh ? "全天消耗" : "TOTAL USAGE", 22, 68);

      const { val, unit } = compactTokens(data.totalTokens, isZh);
      ctx.fillStyle = "#F2F5F7";
      ctx.font = "800 38px Segoe UI";
      ctx.fillText(val + unit, 22, 108);

      ctx.fillStyle = "#34D399";
      ctx.font = "800 11.5px Segoe UI";
      ctx.fillText(`≈ $${data.totalDollars.toFixed(2)} (估算)`, 160, 108);

      // Tab Bar Hint on Export
      ctx.fillStyle = "rgba(255,255,255,0.06)";
      roundRect(ctx, 22, 280, 376, 24, 12);
      ctx.fill();

      ctx.fillStyle = "#2DD4BF";
      ctx.font = "800 10px Segoe UI";
      const tabTitle = currentTab === 'overview' ? '🌐 总览视图 (OVERVIEW)' : `⚡ ${currentTab.toUpperCase()} 专属明细`;
      ctx.fillText(tabTitle, 32, 296);

      // Footer
      ctx.fillStyle = "#F59E0B";
      ctx.font = "700 10px Segoe UI";
      ctx.fillText(isZh ? data.rankText : data.rankTextEn, 22, 542);

      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.font = "700 9px Segoe UI";
      ctx.textAlign = "right";
      ctx.fillText("AGENT ISLAND · LOCAL ONLY", 396, 542);
      ctx.textAlign = "left";

      return canvas;
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function copyCardImage() {
      const canvas = renderToCanvas();
      canvas.toBlob(blob => {
        try {
          const item = new ClipboardItem({ 'image/png': blob });
          navigator.clipboard.write([item]).then(() => {
            showToast("📷 已复制当前视图卡片到剪贴板！");
          }).catch(() => {
            showToast("📷 图片已生成！");
          });
        } catch (e) {
          showToast("📷 图片已生成！");
        }
      });
    }

    function savePngImage() {
      const canvas = renderToCanvas();
      const link = document.createElement('a');
      const tabSuffix = currentTab === 'overview' ? 'Overview' : currentTab;
      link.download = `AgentIsland-Daily-${hierarchicalDailyRecords[currentIndex].dateStr}-${tabSuffix}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast("💾 已保存当前视图 PNG！");
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        t.classList.remove('show');
      }, 2000);
    }

    // Initial render
    render();
  </script>
