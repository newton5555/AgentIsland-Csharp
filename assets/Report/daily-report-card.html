<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentIsland - 日报卡 (Daily Report Card) Agent到模型层级聚合</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /*
     * AgentIsland 日报卡 (Daily Report Card) - 两级层级聚合架构
     * 借鉴 lieflat-charts (Glance 快速判断 + Lupi Editorial 细读感)：
     * 1. 结构：Agent (一级接入宿主) ──► 具体底层 Models (二级消耗明细)
     * 2. 视觉语法：精细发丝树形线 (Hairline Tree Branching)、微型占比 Chunky Bar、等宽 Tabular 数字
     * 3. 规范：严格锁定 420px × 560px portrait (ReportCards.CardWidth / CardHeight)
     * 4. 数据契约：全量接入统计，无多余 enable 状态污染
     */
    :root {
      --card-w: 420px;
      --card-h: 560px;
      --base-bg: #0D0F13;
      --border-hairline: #2D323E;

      /* Color tokens */
      --live-teal: #3DD68C;
      --period-accent: #2DD4BF; /* Teal accent for DAILY & peak hour */
      --price-green: #34D399;   /* Emerald green for dollar amounts */
      --text-hero: #F2F5F7;
      --text-white-90: rgba(255, 255, 255, 0.90);
      --text-white-80: rgba(255, 255, 255, 0.80);
      --text-white-65: rgba(255, 255, 255, 0.65);
      --text-white-50: rgba(255, 255, 255, 0.50);
      --text-white-40: rgba(255, 255, 255, 0.40);
      --text-white-25: rgba(255, 255, 255, 0.25);
      --gold-rank: #F59E0B;

      /* Provider brand accents */
      --claude-accent: #CC785C;
      --codex-accent: #A78BFA;
      --deepseek-accent: #4D6BFE;
      --antigravity-accent: #4285F4;
      --grok-accent: #D8DEE4;
      --cursor-accent: #F5F3EE;
      --doubao-accent: #29C264;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: #060709;
      color: #FFF;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      user-select: none;
    }

    /* Floating Capsule Pager Bar */
    .pager-bar {
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #13161C;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 17px;
      height: 34px;
      padding: 0 4px;
      box-shadow: 0 3px 16px rgba(0, 0, 0, 0.4);
    }

    .pager-btn {
      width: 26px;
      height: 26px;
      border-radius: 13px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.15s ease;
    }

    .pager-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #FFF;
    }

    .pager-label {
      font-size: 12px;
      font-weight: 700;
      color: #F2F2F2;
      min-width: 140px;
      text-align: center;
      font-feature-settings: "tnum" 1;
      cursor: pointer;
    }

    .pager-divider {
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
    }

    /* Fixed 420x560 Share Card (ReportCards.Card) */
    .report-card {
      width: var(--card-w);
      height: var(--card-h);
      background: var(--base-bg);
      border: 1px solid var(--border-hairline);
      border-radius: 24px;
      padding: 24px 26px 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
    }

    .card-content {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 1. Header */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 22px;
    }

    .brand-left {
      display: flex;
      align-items: center;
    }

    .brand-logo {
      width: 22px;
      height: 22px;
      margin-right: 9px;
      object-fit: contain;
    }

    .brand-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--text-white-90);
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--period-accent);
      margin-left: 6px;
    }

    .header-range {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-white-65);
      font-feature-settings: "tnum" 1;
    }

    /* 2. Hero Total Area */
    .card-hero {
      display: flex;
      flex-direction: column;
      margin-top: 2px;
    }

    .hero-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .hero-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-white-50);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .hero-delta-pill {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--live-teal);
      font-feature-settings: "tnum" 1;
    }

    .hero-baseline {
      display: flex;
      align-items: baseline;
      white-space: nowrap;
      overflow: hidden;
    }

    .hero-number {
      font-size: 42px;
      font-weight: 800;
      line-height: 44px;
      color: var(--text-hero);
      font-feature-settings: "tnum" 1;
      letter-spacing: -0.03em;
    }

    .hero-unit {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-hero);
      margin-left: 3px;
    }

    .hero-dollars {
      font-size: 12px;
      font-weight: 800;
      color: var(--price-green);
      margin-left: 10px;
      margin-bottom: 3px;
      font-feature-settings: "tnum" 1;
    }

    /* 3. Daily KPI Strip (3-Column compact stats) */
    .kpi-strip {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 11px;
      padding: 6px 10px;
      margin: 1px 0 2px;
    }

    .kpi-cell {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .kpi-cell:not(:last-child) {
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      padding-right: 6px;
    }

    .kpi-label {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-white-40);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .kpi-val {
      font-size: 12.5px;
      font-weight: 800;
      color: #FFF;
      font-feature-settings: "tnum" 1;
    }

    .kpi-sub {
      font-size: 8.5px;
      font-weight: 600;
      color: var(--period-accent);
    }

    /* 4. 24-Hour Activity Pulse (24根紧凑脉冲柱) */
    .hourly-pulse-area {
      display: flex;
      flex-direction: column;
      margin: 2px 0;
    }

    .pulse-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }

    .pulse-caption {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--text-white-40);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .pulse-peak-badge {
      font-size: 9px;
      font-weight: 800;
      color: var(--period-accent);
      font-feature-settings: "tnum" 1;
    }

    .hours-grid {
      display: grid;
      grid-template-columns: repeat(24, 1fr);
      align-items: flex-end;
      gap: 2px;
      height: 34px;
    }

    .hour-bar-col {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .hour-bar {
      width: 100%;
      min-height: 2.5px;
      border-radius: 1.5px;
      background: rgba(255, 255, 255, 0.07);
    }

    .hour-bar.has-tokens {
      background: rgba(255, 255, 255, 0.2);
    }

    .hour-bar.peak {
      background: var(--period-accent);
      box-shadow: 0 0 6px rgba(45, 212, 191, 0.5);
    }

    .hours-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
      font-size: 8px;
      font-weight: 700;
      color: var(--text-white-35);
      font-feature-settings: "tnum" 1;
    }

    /* 5. Agent ──► Model 层级聚合核心区域 (Hierarchical Aggregation) */
    .hierarchy-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 1px;
    }

    .hierarchy-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px 2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .hierarchy-title {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-white-50);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .hierarchy-legend {
      font-size: 8.5px;
      font-weight: 600;
      color: var(--text-white-40);
    }
    /* Agent Group Card */
    .agent-tree-block {
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid rgba(255, 255, 255, 0.035);
      padding-bottom: 4px;
    }

    .agent-tree-block:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    /* Level 1: Agent Summary Row */
    .agent-parent-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2.5px 0;
    }

    .agent-parent-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .agent-mark-icon {
      width: 15px;
      height: 15px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .agent-title {
      font-size: 12px;
      font-weight: 800;
      color: #FFF;
      letter-spacing: -0.01em;
    }

    /* Chunky share pill (lieflat-charts G3) */
    .agent-share-bar-wrap {
      width: 52px;
      height: 5px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 3px;
      overflow: hidden;
      margin-left: 6px;
    }

    .agent-share-bar-fill {
      height: 100%;
      border-radius: 3px;
    }

    .agent-parent-right {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .agent-total-tokens {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-white-90);
      font-feature-settings: "tnum" 1;
    }

    .agent-total-dollars {
      font-size: 10.5px;
      font-weight: 800;
      color: #8CD99E;
      font-feature-settings: "tnum" 1;
      min-width: 36px;
      text-align: right;
    }

    .agent-total-dollars.unpriced {
      color: var(--text-white-25);
    }

    .agent-total-pct {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-white-90);
      font-feature-settings: "tnum" 1;
      width: 30px;
      text-align: right;
    }

    /* Level 2: Nested Child Models (Lupi 树状分支发丝线) */
    .model-children-container {
      display: flex;
      flex-direction: column;
      padding-left: 8px;
      margin-top: 1px;
    }

    .model-child-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 17px;
      position: relative;
    }

    /* Tree Branching Wire */
    .model-tree-line {
      display: inline-flex;
      align-items: center;
      color: rgba(255, 255, 255, 0.22);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      margin-right: 6px;
      user-select: none;
    }

    .model-name-text {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-white-65);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .model-metrics-group {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .model-sub-turns {
      font-size: 8.5px;
      font-weight: 600;
      color: var(--text-white-35);
      font-feature-settings: "tnum" 1;
    }

    .model-sub-tokens {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--text-white-50);
      font-feature-settings: "tnum" 1;
      min-width: 44px;
      text-align: right;
    }

    .model-sub-share {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-white-40);
      font-feature-settings: "tnum" 1;
      width: 30px;
      text-align: right;
    }

    /* 6. Footer (Gold Rank Line) */
    .card-footer {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-top: 5px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .footer-rank {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--gold-rank);
    }

    .footer-lifetime {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--text-white-35);
      letter-spacing: 0.05em;
    }

    /* Bottom Action Buttons */
    .window-actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }

    .action-btn {
      height: 30px;
      border-radius: 15px;
      padding: 0 18px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s ease;
    }

    .action-btn-primary {
      background: #252830;
      color: #FFF;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .action-btn-primary:hover {
      background: #323642;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      background: #181B22;
      color: #FFF;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Floating Period Pager Bar -->
  <nav class="pager-bar">
    <button class="pager-btn" onclick="stepPeriod(-1)" title="前一天 (←)">◀</button>
    <div class="pager-label" id="pager-title" onclick="resetToToday()">2026年9月9日 (今天)</div>
    <button class="pager-btn" onclick="stepPeriod(1)" title="后一天 (→)">▶</button>
  </nav>

  <!-- 420x560 Share Card (Hierarchical Aggregation: Agents -> Models) -->
  <main class="report-card" id="cardViewport">
    <div class="card-content">

      <!-- 1. Header -->
      <section class="card-header">
        <div class="brand-left">
          <img src="../agentisland_logo_small.png" alt="Logo" class="brand-logo" />
          <span class="brand-title">AGENT ISLAND</span>
          <span class="brand-tag">DAILY</span>
        </div>
        <div class="header-range" id="header-date">9月9日</div>
      </section>

      <!-- 2. Hero Total Area -->
      <section class="card-hero">
        <div class="hero-title-row">
          <span class="hero-title" id="hero-title">全天消耗</span>
          <span class="hero-delta-pill" id="hero-delta">↑ 18.4%</span>
        </div>
        <div class="hero-baseline">
          <span class="hero-number" id="hero-num">348</span>
          <span class="hero-unit" id="hero-unit">万</span>
          <span class="hero-dollars" id="hero-dollars">≈ $14.62 (估算)</span>
        </div>
      </section>

      <!-- 3. KPI Strip (Turns, Cache Hit, Connected Agents) -->
      <section class="kpi-strip">
        <div class="kpi-cell">
          <span class="kpi-label" id="kpi-lbl-turns">轮次 TURNS</span>
          <span class="kpi-val" id="kpi-val-turns">142</span>
          <span class="kpi-sub" id="kpi-sub-turns">8 个会话</span>
        </div>
        <div class="kpi-cell">
          <span class="kpi-label" id="kpi-lbl-cache">PROMPT 缓存</span>
          <span class="kpi-val" id="kpi-val-cache">76.8%</span>
          <span class="kpi-sub" id="kpi-sub-cache">省 $5.40</span>
        </div>
        <div class="kpi-cell">
          <span class="kpi-label" id="kpi-lbl-agents">宿主 / 模型</span>
          <span class="kpi-val" id="kpi-val-agents">5 家活跃</span>
          <span class="kpi-sub" id="kpi-sub-agents">8 款模型</span>
        </div>
      </section>

      <!-- 4. 24-Hour Activity Pulse -->
      <section class="hourly-pulse-area">
        <div class="pulse-title-row">
          <span class="pulse-caption" id="pulse-title">24H 脉冲</span>
          <span class="pulse-peak-badge" id="pulse-peak-label">🔥 15:00 · 520K</span>
        </div>
        <div class="hours-grid" id="hours-grid">
          <!-- 24 hourly bars -->
        </div>
        <div class="hours-labels">
          <span>00:00</span>
          <span>06:00</span>
          <span>12:00</span>
          <span>18:00</span>
          <span>24:00</span>
        </div>
      </section>

      <!-- 5. Agent ──► Model 层级树形聚合 (Hierarchical Breakdown) -->
      <section class="hierarchy-section">
        <div class="hierarchy-header-row">
          <span class="hierarchy-title" id="hierarchy-title">AGENTS & MODELS</span>
          <span class="hierarchy-legend">SHARE</span>
        </div>

        <div id="hierarchy-tree-container">
          <!-- Dynamically populated: Tree Branch only -->
        </div>
      </section>

      <!-- 6. Footer -->
      <footer class="card-footer">
        <span class="footer-rank" id="footer-rank">🏆 活跃度前 8% 开发者</span>
        <span class="footer-lifetime">AGENT ISLAND · LOCAL ONLY</span>
      </footer>

    </div>
  </main>

  <!-- Bottom Action Buttons -->
  <div class="window-actions">
    <button class="action-btn action-btn-primary" onclick="copyCardImage()">
      <span>📷 复制图片</span>
    </button>
    <button class="action-btn action-btn-primary" onclick="savePngImage()">
      <span>💾 保存 PNG</span>
    </button>
  </div>

  <div class="toast" id="toast">已成功复制图片！</div>
  <canvas id="renderCanvas" style="display:none;"></canvas>

        const isPeak = tok === maxTokens && tok > 0;

    // 树状分支 (Lupi Editorial / G7 Tree LR)
    function renderHierarchyTree(agents) {
      const container = document.getElementById('hierarchy-tree-container');
      container.innerHTML = '';

      agents.forEach(agent => {
        const block = document.createElement('div');
        block.className = 'agent-tree-block';

        const dollarsStr = agent.hasPrice ? `$${agent.dollars.toFixed(2)}` : '—';
        const dollarClass = agent.hasPrice ? 'agent-total-dollars' : 'agent-total-dollars unpriced';

        // Level 1: Agent Header Row with Official Tinted Mark
        const parentRow = document.createElement('div');
        parentRow.className = 'agent-parent-row';
        parentRow.innerHTML = `
          <div class="agent-parent-left">
            ${getAgentMarkHtml(agent.id, 15)}
            <span class="agent-title">${agent.name}</span>
            <div class="agent-share-bar-wrap" title="${Math.round(agent.percent * 100)}%">
              <div class="agent-share-bar-fill" style="width: ${Math.round(agent.percent * 100)}%; background: ${agent.accent};"></div>
            </div>
          </div>
          <div class="agent-parent-right">
            <span class="agent-total-tokens">${compactShort(agent.tokens, isZh)}</span>
            <span class="${dollarClass}">${dollarsStr}</span>
            <span class="agent-total-pct">${Math.round(agent.percent * 100)}%</span>
          </div>
        `;
        block.appendChild(parentRow);

        // Level 2: Child Models with Tree Wire Lines (Lupi Branching)
        const childrenContainer = document.createElement('div');
        childrenContainer.className = 'model-children-container';

        agent.models.forEach((mod, idx) => {
          const isLast = idx === agent.models.length - 1;
          const wireChar = isLast ? '└──' : '├──';

          const childRow = document.createElement('div');
          childRow.className = 'model-child-row';
          childRow.innerHTML = `
            <div style="display: flex; align-items: center; overflow: hidden;">
              <span class="model-tree-line">${wireChar}</span>
              <span class="model-name-text">${mod.name}</span>
            </div>
            <div class="model-metrics-group">
              <span class="model-sub-turns">${mod.turns}轮</span>
              <span class="model-sub-tokens">${compactShort(mod.tokens, isZh)}</span>
              <span class="model-sub-share">${Math.round(mod.percent * 100)}%</span>
            </div>
          `;
          childrenContainer.appendChild(childRow);
        });

        block.appendChild(childrenContainer);
        container.appendChild(block);
      });
    }

    function compactTokens(n, zh) {
      if (zh) {
        if (n >= 100000000) return { val: (n / 100000000).toFixed(1).replace('.0', ''), unit: "亿" };
        if (n >= 10000) return { val: Math.round(n / 10000).toString(), unit: "万" };
        return { val: n.toLocaleString(), unit: "" };
      }
      if (n >= 1000000) return { val: (n / 1000000).toFixed(2).replace(/\.?0+$/, ''), unit: "M" };
      if (n >= 1000) return { val: Math.round(n / 1000).toString(), unit: "K" };
      return { val: n.toString(), unit: "" };
    }

    function compactShort(n, zh) {
      if (zh) {
        if (n >= 100000000) return (n / 100000000).toFixed(1).replace('.0', '') + "亿";
        if (n >= 10000) return Math.round(n / 10000) + "万";
        return n.toString();
      }
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + "M";
      if (n >= 1000) return Math.round(n / 1000) + "K";
      return n.toString();
    }

    function stepPeriod(delta) {
      const next = currentIndex - delta;
      if (next >= 0 && next < hierarchicalDailyRecords.length) {
        currentIndex = next;
        render();
      }
    }

    function resetToToday() {
      currentIndex = 0;
      render();
    }

    // 复制图片与保存图片 (3x Retina 导出)
    function renderToCanvas() {
      const canvas = document.getElementById('renderCanvas');
      const ctx = canvas.getContext('2d');
      const scale = 3;
      canvas.width = 420 * scale;
      canvas.height = 560 * scale;
      ctx.scale(scale, scale);

      // Card Background #0D0F13
      ctx.fillStyle = "#0D0F13";
      roundRect(ctx, 0, 0, 420, 560, 24);
      ctx.fill();

      // Border #2D323E
      ctx.strokeStyle = "#2D323E";
      ctx.lineWidth = 1;
      roundRect(ctx, 0.5, 0.5, 419, 559, 24);
      ctx.stroke();

      const data = hierarchicalDailyRecords[currentIndex];

      // Header
      ctx.fillStyle = "rgba(255,255,255,0.88)";
      ctx.font = "800 11px Segoe UI";
      ctx.fillText("AGENT ISLAND", 56, 42);

      ctx.fillStyle = "#2DD4BF";
      ctx.fillText("DAILY", 154, 42);

      ctx.fillStyle = "rgba(255,255,255,0.65)";
      ctx.font = "700 11px Segoe UI";
      ctx.textAlign = "right";
      ctx.fillText(isZh ? data.dateStr : data.dateStrEn, 392, 42);
      ctx.textAlign = "left";

      // Hero
      ctx.fillStyle = "rgba(255,255,255,0.50)";
      ctx.font = "700 11px Segoe UI";
      ctx.fillText(isZh ? "全天消耗" : "TOTAL USAGE", 28, 76);

      const { val, unit } = compactTokens(data.totalTokens, isZh);
      ctx.fillStyle = "#F2F5F7";
      ctx.font = "800 42px Segoe UI";
      ctx.fillText(val + unit, 28, 122);

      ctx.fillStyle = "#34D399";
      ctx.font = "800 12px Segoe UI";
      ctx.fillText(`≈ $${data.totalDollars.toFixed(2)} (估算)`, 175, 122);

      // Footer
      ctx.fillStyle = "#F59E0B";
      ctx.font = "700 10.5px Segoe UI";
      ctx.fillText(isZh ? data.rankText : data.rankTextEn, 28, 538);

      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.font = "700 9.5px Segoe UI";
      ctx.textAlign = "right";
      ctx.fillText("AGENT ISLAND · LOCAL ONLY", 392, 538);
      ctx.textAlign = "left";

      return canvas;
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function copyCardImage() {
      const canvas = renderToCanvas();
      canvas.toBlob(blob => {
        try {
          const item = new ClipboardItem({ 'image/png': blob });
          navigator.clipboard.write([item]).then(() => {
            showToast("📷 已复制卡片图片到剪贴板！");
          }).catch(() => {
            showToast("📷 图片已生成！");
          });
        } catch (e) {
          showToast("📷 图片已生成！");
        }
      });
    }

    function savePngImage() {
      const canvas = renderToCanvas();
      const link = document.createElement('a');
      link.download = `AgentIsland-Daily-${hierarchicalDailyRecords[currentIndex].dateStr}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast("💾 已保存卡片 PNG！");
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        t.classList.remove('show');
      }, 2000);
    }

    // Initial render
    render();
  </script>
</body>
</html>
